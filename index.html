<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Wheel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes resultPop{0%{transform:scale(.7) translateY(10px);opacity:0}70%{transform:scale(1.1) translateY(-3px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
.result-pop{animation:resultPop .45s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes glow{0%,100%{box-shadow:0 0 8px 2px #fbbf24}50%{box-shadow:0 0 22px 6px #fbbf24}}
.glow{animation:glow 1s ease infinite}
</style>
</head>
<body class="bg-gradient-to-br from-fuchsia-50 to-pink-100 min-h-screen font-sans">
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-fuchsia-800 mb-1">Spin to Pick</h1>
    <p class="text-fuchsia-400 text-sm">Random name draw with a spinning wheel</p>
  </div>

  <div class="grid md:grid-cols-2 gap-6">
    <div class="flex flex-col items-center">
      <div class="relative mb-3">
        <canvas id="wheel" width="300" height="300" aria-label="Spinner wheel" class="rounded-full shadow-2xl"></canvas>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1 z-10" aria-hidden="true">
          <div class="w-0 h-0 border-l-[12px] border-r-[12px] border-t-[28px] border-l-transparent border-r-transparent border-t-yellow-400 drop-shadow-lg"></div>
        </div>
      </div>
      <button id="spinBtn" onclick="spin()" class="px-10 py-3 bg-fuchsia-600 hover:bg-fuchsia-700 text-white text-lg font-bold rounded-2xl shadow-lg transition active:scale-95 disabled:opacity-50" aria-label="Spin the wheel">Spin!</button>
      <div id="resultBox" class="mt-4 text-center hidden">
        <div class="text-xs text-fuchsia-500 uppercase tracking-widest mb-1">Winner!</div>
        <div id="resultName" class="text-3xl font-extrabold text-fuchsia-700 result-pop bg-white rounded-2xl px-6 py-3 shadow-lg glow"></div>
        <div class="flex gap-3 justify-center mt-3">
          <button onclick="removeWinner()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-sm font-semibold shadow transition">Remove from wheel</button>
          <button onclick="keepWinner()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-sm font-semibold shadow transition">Keep & spin again</button>
        </div>
      </div>
    </div>

    <div class="flex flex-col">
      <div class="bg-white rounded-2xl shadow-lg p-4 flex-1">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Names <span class="text-fuchsia-500" id="nameCountLabel">(0/20)</span></h2>
          <button onclick="resetAll()" class="text-xs text-gray-400 hover:text-red-400 transition">Reset</button>
        </div>
        <div class="flex gap-2 mb-3">
          <input type="text" id="nameInput" maxlength="24" placeholder="Add a name..." aria-label="Name to add"
            class="flex-1 border-2 border-fuchsia-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-fuchsia-400 transition"
            onkeydown="if(event.key==='Enter')addName()">
          <button onclick="addName()" class="px-4 py-2 bg-fuchsia-600 hover:bg-fuchsia-700 text-white rounded-xl text-sm font-bold shadow transition">Add</button>
        </div>
        <div id="nameList" class="space-y-1.5 max-h-64 overflow-y-auto pr-1"></div>
        <div id="emptyMsg" class="text-center text-gray-300 text-sm py-6">Add names above to get started</div>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS=['#f43f5e','#f97316','#eab308','#22c55e','#06b6d4','#6366f1','#a855f7','#ec4899','#14b8a6','#84cc16','#ef4444','#fb923c','#facc15','#4ade80','#22d3ee','#818cf8','#c084fc','#fb7185','#2dd4bf','#a3e635'];
let names=JSON.parse(localStorage.getItem('spinNames')||'[]');
let spinning=false,angle=0,lastWinner=null;

function save(){localStorage.setItem('spinNames',JSON.stringify(names));}

function addName(){
  const inp=document.getElementById('nameInput');
  const n=inp.value.trim();
  if(!n||names.length>=20)return;
  names.push(n);inp.value='';save();renderList();drawWheel();
}

function removeName(i){names.splice(i,1);save();renderList();drawWheel();}

function renderList(){
  const ul=document.getElementById('nameList');ul.innerHTML='';
  document.getElementById('nameCountLabel').textContent='('+names.length+'/20)';
  document.getElementById('emptyMsg').style.display=names.length?'none':'block';
  names.forEach((n,i)=>{
    const li=document.createElement('div');
    li.className='flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-1.5';
    const dot=document.createElement('span');dot.className='w-3 h-3 rounded-full flex-shrink-0';dot.style.background=COLORS[i%COLORS.length];
    const txt=document.createElement('span');txt.className='flex-1 text-sm text-gray-700 font-medium truncate';txt.textContent=n;
    const btn=document.createElement('button');btn.textContent='×';btn.className='text-gray-300 hover:text-red-400 text-lg leading-none transition';btn.setAttribute('aria-label','Remove '+n);
    btn.onclick=()=>removeName(i);
    li.appendChild(dot);li.appendChild(txt);li.appendChild(btn);ul.appendChild(li);
  });
}

function drawWheel(highlightIdx=-1){
  const canvas=document.getElementById('wheel');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=cx-8;
  ctx.clearRect(0,0,W,H);
  if(!names.length){
    ctx.fillStyle='#f3f4f6';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#9ca3af';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('Add names!',cx,cy);
    return;
  }
  const sliceAngle=(Math.PI*2)/names.length;
  names.forEach((n,i)=>{
    const start=angle+i*sliceAngle,end=start+sliceAngle;
    ctx.save();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
    ctx.fillStyle=i===highlightIdx?'#fef08a':COLORS[i%COLORS.length];
    ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(start+sliceAngle/2);
    ctx.textAlign='right';ctx.fillStyle=i===highlightIdx?'#78350f':'#fff';
    ctx.font='bold '+Math.min(14,Math.max(9,200/names.length))+'px sans-serif';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=3;
    const maxLen=r-24;
    let label=n;
    ctx.font='bold '+Math.min(14,Math.max(9,200/names.length))+'px sans-serif';
    while(ctx.measureText(label).width>maxLen&&label.length>3)label=label.slice(0,-1)+'…';
    ctx.fillText(label,r-12,5);
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#e5e7eb';ctx.lineWidth=2;ctx.stroke();
}

function spin(){
  if(spinning||names.length<2){if(names.length<2)alert('Add at least 2 names!');return;}
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('resultBox').classList.add('hidden');
  const targetIdx=Math.floor(Math.random()*names.length);
  const sliceAngle=(Math.PI*2)/names.length;
  const targetAngle=Math.PI*2-targetIdx*sliceAngle-sliceAngle/2;
  const extraSpins=(5+Math.floor(Math.random()*5))*Math.PI*2;
  const totalAngle=extraSpins+((targetAngle-angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2));
  const duration=3000+Math.random()*1500;
  const startAngle=angle,start=performance.now();
  function frame(now){
    const t=Math.min(1,(now-start)/duration);
    const ease=1-Math.pow(1-t,4);
    angle=startAngle+totalAngle*ease;
    const currentSlice=Math.floor((((Math.PI*2-(angle%(Math.PI*2)))+Math.PI*2)%(Math.PI*2))/sliceAngle)%names.length;
    drawWheel(currentSlice);
    if(t<1){requestAnimationFrame(frame);}
    else{
      angle=startAngle+totalAngle;
      spinning=false;
      document.getElementById('spinBtn').disabled=false;
      lastWinner=targetIdx;
      showResult(targetIdx);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(idx){
  drawWheel(idx);
  const box=document.getElementById('resultBox');
  const nameEl=document.getElementById('resultName');
  nameEl.textContent=names[idx];
  box.classList.remove('hidden');
  nameEl.classList.remove('result-pop');void nameEl.offsetWidth;nameEl.classList.add('result-pop');
}

function removeWinner(){
  if(lastWinner===null)return;
  names.splice(lastWinner,1);lastWinner=null;
  save();renderList();drawWheel();
  document.getElementById('resultBox').classList.add('hidden');
}

function keepWinner(){document.getElementById('resultBox').classList.add('hidden');spin();}

function resetAll(){names=[];lastWinner=null;save();renderList();drawWheel();document.getElementById('resultBox').classList.add('hidden');}

renderList();drawWheel();
</script>
</body>
</html>
